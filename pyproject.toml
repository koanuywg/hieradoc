[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hieradoc"
version = "0.1.0"
description = "Hierarchical Tree-of-Thought RAG with Zero-Hallucination Line Citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HieraDoc Team" }
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "hierarchical-rag",
    "llm",
    "agents",
    "citations",
    "zero-hallucination",
    "document-intelligence"
]
dependencies = [
    "openai>=1.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
cloud = ["supabase>=2.3.0"]
all = ["pypdf>=4.0.0", "supabase>=2.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hieradoc*"]
